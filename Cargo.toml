[workspace]
resolver = "2"
members = [
    "crates/lisp-core",
    "crates/lisp",
    "crates/lisp-bench",
    "crates/lisp-conformance",
]
default-members = [
    "crates/lisp-core",
    "crates/lisp",
    "crates/lisp-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.95"
gc-arena = "0.5"
gc-arena-derive = "0.5"
nom = "8.0.0"
rustyline = "15.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.11"
toml = "1.0.7"
