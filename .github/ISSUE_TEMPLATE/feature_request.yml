name: Feature request
description: Propose a new language feature, builtin, or tooling improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What capability should be added?
      placeholder: Describe the desired feature.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful for the interpreter or contributors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Suggest syntax, semantics, or implementation direction if you have one.
  - type: textarea
    id: validation
    attributes:
      label: Validation ideas
      description: What tests or examples should pass after this is implemented?
