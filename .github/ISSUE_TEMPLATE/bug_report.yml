name: Bug report
description: Report a runtime, parser, REPL, closure, or GC bug
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide input, steps, or commands to reproduce the issue.
      placeholder: |
        1. Run `cargo run`
        2. Evaluate `(some expression)`
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe the expected parse or evaluation result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Describe the actual result or error.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Mention whether the issue affects parsing, evaluation, closures, GC, or REPL behavior.
